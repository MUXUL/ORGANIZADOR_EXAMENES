<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alineador de Resultados de Laboratorio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --primary: #0f766e;
      --primary-hover: #115e59;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --red: #dc2626;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1100px;
      width: 100%;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 2rem;
      border: 1px solid var(--border);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
      color: var(--primary);
      text-align: center;
    }
    p.subtitle {
      text-align: center;
      color: #64748b;
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      padding: 2rem 1rem;
      text-align: center;
      background: #f1f5f9;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 1.25rem;
    }
    .upload-box:hover {
      border-color: var(--primary);
      background: #f0fdfa;
    }
    input[type="file"] {
      display: none;
    }
    .options {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    select {
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
    }
    .status {
      margin-top: 1rem;
      text-align: center;
      font-weight: 600;
      color: var(--primary);
    }
    .actions {
      margin-top: 1.25rem;
      display: flex;
      justify-content: center;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      display: none;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    .table-wrapper {
      margin-top: 1.75rem;
      overflow-x: auto;
      max-height: 500px;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: right;
      white-space: nowrap;
    }
    th {
      background-color: #f1f5f9;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .cod-rojo {
      color: var(--red);
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Alineador de Exámenes por Código</h1>
  <p class="subtitle">Sube tu archivo Excel (.xlsx) para alinear cada resultado frente a su código correspondiente.</p>

  <label class="upload-box" for="excelInput">
    <strong>Haz clic aquí para seleccionar tu archivo Excel (.xlsx)</strong>
    <span style="font-size: 0.85rem; color: #64748b;">El procesamiento es 100% local en tu navegador</span>
    <input type="file" id="excelInput" accept=".xlsx" />
  </label>

  <div class="options">
    <label for="colInicio">Columna donde empieza el primer examen:</label>
    <select id="colInicio">
      <option value="2" selected>Columna B (igual a tu imagen)</option>
      <option value="1">Columna A</option>
    </select>
  </div>

  <div class="status" id="status"></div>

  <div class="actions">
    <button id="btnDescargar">Descargar Excel Alineado (.xlsx)</button>
  </div>

  <div class="table-wrapper" id="tableWrapper">
    <table id="previewTable"></table>
  </div>
</div>

<script>
  let workbookSalida = null;

  const excelInput = document.getElementById('excelInput');
  const colInicioSelect = document.getElementById('colInicio');
  const statusDiv = document.getElementById('status');
  const btnDescargar = document.getElementById('btnDescargar');
  const tableWrapper = document.getElementById('tableWrapper');
  const previewTable = document.getElementById('previewTable');

  excelInput.addEventListener('change', procesarArchivo);
  colInicioSelect.addEventListener('change', () => {
    if (excelInput.files.length > 0) procesarArchivo();
  });

  async function procesarArchivo() {
    const file = excelInput.files[0];
    if (!file) return;

    statusDiv.textContent = "Procesando archivo...";
    btnDescargar.style.display = "none";
    tableWrapper.style.display = "none";

    try {
      const arrayBuffer = await file.arrayBuffer();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(arrayBuffer);

      const ws = wb.worksheets[0];
      const colInicio = parseInt(colInicioSelect.value, 10);
      const maxCols = ws.columnCount;
      const maxRows = ws.rowCount;

      const examenes = [];
      const todosLosCodigos = new Set();

      for (let c = colInicio; c <= maxCols; c += 2) {
        const headerVal = ws.getRow(1).getCell(c).text?.trim();
        if (!headerVal) break;

        const mapaValores = new Map();

        for (let r = 2; r <= maxRows; r++) {
          const row = ws.getRow(r);
          let codRaw = row.getCell(c).value;
          let valRaw = row.getCell(c + 1).value;

          if (codRaw && typeof codRaw === 'object') {
            codRaw = codRaw.result !== undefined ? codRaw.result : (codRaw.richText ? codRaw.richText.map(t => t.text).join('') : '');
          }
          if (valRaw && typeof valRaw === 'object') {
            valRaw = valRaw.result !== undefined ? valRaw.result : (valRaw.richText ? valRaw.richText.map(t => t.text).join('') : '');
          }

          if (codRaw !== null && codRaw !== undefined && String(codRaw).trim() !== '') {
            const codStr = String(codRaw).trim();
            mapaValores.set(codStr, valRaw);
            todosLosCodigos.add(codStr);
          }
        }

        examenes.push({ nombre: headerVal, datos: mapaValores });
      }

      if (examenes.length === 0) {
        statusDiv.textContent = "No se encontraron encabezados en la fila 1. Prueba cambiando la columna de inicio.";
        return;
      }

      const codigosOrdenados = Array.from(todosLosCodigos).sort((a, b) => {
        const numA = Number(a), numB = Number(b);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
      });

      workbookSalida = new ExcelJS.Workbook();
      const wsOut = workbookSalida.addWorksheet("Resultados Alineados");

      previewTable.innerHTML = "";
      const thead = document.createElement("thead");
      const trHead = document.createElement("tr");

      let colActual = colInicio;
      examenes.forEach(ex => {
        const cellH = wsOut.getRow(1).getCell(colActual);
        cellH.value = ex.nombre;
        cellH.font = { bold: true };

        const thCod = document.createElement("th");
        thCod.textContent = ex.nombre;
        const thVal = document.createElement("th");
        thVal.textContent = "";
        trHead.appendChild(thCod);
        trHead.appendChild(thVal);

        colActual += 2;
      });
      thead.appendChild(trHead);
      previewTable.appendChild(thead);

      const tbody = document.createElement("tbody");

      codigosOrdenados.forEach((codigo, idx) => {
        const filaExcel = idx + 2;
        const rowOut = wsOut.getRow(filaExcel);
        const tr = document.createElement("tr");

        let cOut = colInicio;
        examenes.forEach(ex => {
          const tdCod = document.createElement("td");
          const tdVal = document.createElement("td");

          if (ex.datos.has(codigo)) {
            const valor = ex.datos.get(codigo);
            const codFinal = !isNaN(Number(codigo)) ? Number(codigo) : codigo;

            const cellCod = rowOut.getCell(cOut);
            cellCod.value = codFinal;
            cellCod.font = { color: { argb: 'FFFF0000' }, bold: true, size: 12 };

            if (valor !== null && valor !== undefined && String(valor).trim() !== '') {
              rowOut.getCell(cOut + 1).value = valor;
              tdVal.textContent = valor;
            }

            tdCod.textContent = codFinal;
            tdCod.className = "cod-rojo";
          }

          tr.appendChild(tdCod);
          tr.appendChild(tdVal);
          cOut += 2;
        });

        tbody.appendChild(tr);
      });

      previewTable.appendChild(tbody);

      statusDiv.textContent = `¡Listo! Se alinearon ${codigosOrdenados.length} códigos en ${examenes.length} exámenes.`;
      btnDescargar.style.display = "inline-block";
      tableWrapper.style.display = "block";

    } catch (err) {
      console.error(err);
      statusDiv.textContent = "Error al leer el archivo. Asegúrate de que sea un .xlsx válido.";
    }
  }

  btnDescargar.addEventListener('click', async () => {
    if (!workbookSalida) return;
    const buffer = await workbookSalida.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "resultados_alineados.xlsx";
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
